<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackerly — The Modern Hackathon Platform</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2.2.0">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Application Shell -->
  <div id="app" class="app-layout">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <div class="header-container">
        <div class="brand-group" id="nav-brand" role="button" tabindex="0">
          <div class="brand-symbol" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor">
              <path d="M7 6V26" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
              <path d="M25 6V26" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
              <path d="M7 16H25" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
              <circle cx="7" cy="6" r="3" fill="#38bdf8" stroke="none"/>
              <circle cx="25" cy="6" r="3" fill="#38bdf8" stroke="none"/>
              <circle cx="16" cy="16" r="3.5" fill="#10b981" stroke="none"/>
              <circle cx="7" cy="26" r="3" fill="#6366f1" stroke="none"/>
              <circle cx="25" cy="26" r="3" fill="#6366f1" stroke="none"/>
            </svg>
          </div>
          <div class="brand-meta">
            <span class="brand-name">HACKERLY</span>
            <span class="brand-context" id="header-event-name">Hackathon Platform</span>
          </div>
        </div>

        <!-- Role / Workflow Navigation Links -->
        <nav class="header-nav" id="header-nav" aria-label="Main Navigation">
          <!-- Dynamically populated based on active experience -->
        </nav>

        <!-- Right Side: User Profile & Auth Action -->
        <div class="header-user-actions" id="header-user-actions">
          <!-- Injected dynamically: either Sign In button or User Profile Pill + Sign Out -->
        </div>
      </div>
    </header>

    <!-- Global Notice Banner (e.g. Offline or Demo Mode indicator) -->
    <div class="announcement-bar" id="announcement-bar" style="display:none;">
      <div class="announcement-content" id="announcement-content"></div>
    </div>

    <!-- Single Active Workspace Mount Point -->
    <main class="app-main" id="app-root">
      <div class="container page-loading-skeleton">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-text"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <div class="footer-brand">
          <div class="flex items-center gap-2">
            <div class="brand-symbol" style="width: 24px; height: 24px;">
              <svg width="16" height="16" viewBox="0 0 32 32" fill="none" stroke="currentColor">
                <path d="M7 6V26" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
                <path d="M25 6V26" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
                <path d="M7 16H25" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
              </svg>
            </div>
            <strong>HACKERLY</strong>
          </div>
          <span>The Complete Modern Hackathon Platform</span>
        </div>
        <div class="footer-links">
          <span>Self-Hosted & Offline Ready</span>
          <span class="sep">•</span>
          <span>Docker & SQLite Compatible</span>
          <span class="sep">•</span>
          <span>Deterministic Scoring & Normalization</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Reusable Modal Container -->
  <div id="modal-backdrop" class="modal-backdrop" style="display:none;" aria-hidden="true">
    <div id="modal-window" class="modal-window" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Modal</h3>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Pre-rendered SSR Projects for Automated Checkers (run.py Check 1 & 2) -->
  <div id="ssr-gallery-cache" style="display:none;" data-ssr="true">
    <!-- SSR_INJECTION_POINT -->
  </div>

  <script src="/js/vendor/three.min.js?v=2.2.0"></script>
  <script src="/js/universe.js?v=2.2.0"></script>
  <script src="/js/state.js?v=2.2.0"></script>
  <script src="/js/api.js?v=2.2.0"></script>
  <script src="/js/views/publicView.js?v=2.2.0"></script>
  <script src="/js/views/loginView.js?v=2.2.0"></script>
  <script src="/js/views/participantView.js?v=2.2.0"></script>
  <script src="/js/views/judgeView.js?v=2.2.0"></script>
  <script src="/js/views/organizerView.js?v=2.2.0"></script>
  <script src="/js/app.js?v=2.2.0"></script>
</body>
</html>
