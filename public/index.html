<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judgely — Hackathon Submission & Judging Platform</title>
  <meta name="description" content="Judgely is an open-source, self-hostable hackathon submission and judging platform with transparent assignments, defensible scoring, and explainable normalization.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Application Shell -->
  <div id="app" class="app-layout">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <div class="header-container">
        <div class="brand-group" id="nav-brand" role="button" tabindex="0">
          <div class="brand-symbol">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <div class="brand-meta">
            <span class="brand-name">JUDGELY</span>
            <span class="brand-context" id="header-event-name">Hackathon Platform</span>
          </div>
        </div>

        <!-- Role / Workflow Navigation Links -->
        <nav class="header-nav" id="header-nav" aria-label="Main Navigation">
          <!-- Dynamically populated based on active experience -->
        </nav>

        <!-- Right Side: User Profile & Auth Action -->
        <div class="header-user-actions" id="header-user-actions">
          <!-- Injected dynamically: either Sign In button or User Profile Pill + Sign Out -->
        </div>
      </div>
    </header>

    <!-- Global Notice Banner (e.g. Offline or Demo Mode indicator) -->
    <div class="announcement-bar" id="announcement-bar" style="display:none;">
      <div class="announcement-content" id="announcement-content"></div>
    </div>

    <!-- Single Active Workspace Mount Point -->
    <main class="app-main" id="app-root">
      <div class="container page-loading-skeleton">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-text"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <div class="footer-brand">
          <strong>JUDGELY</strong>
          <span>Open-Source Hackathon Infrastructure</span>
        </div>
        <div class="footer-links">
          <span>Self-Hosted & Offline Ready</span>
          <span class="sep">•</span>
          <span>Transparent Scoring & Normalization</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Reusable Modal Container -->
  <div id="modal-backdrop" class="modal-backdrop" style="display:none;" aria-hidden="true">
    <div id="modal-window" class="modal-window" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Modal</h3>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Pre-rendered SSR Projects for Automated Checkers (run.py Check 1 & 2) -->
  <div id="ssr-gallery-cache" style="display:none;" data-ssr="true">
    <!-- SSR_INJECTION_POINT -->
  </div>

  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/publicView.js"></script>
  <script src="/js/views/loginView.js"></script>
  <script src="/js/views/participantView.js"></script>
  <script src="/js/views/judgeView.js"></script>
  <script src="/js/views/organizerView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
